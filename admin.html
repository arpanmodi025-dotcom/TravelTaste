
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelTaste Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      color: #243247;
    }
    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { color: #e45a2a; margin: 0; }
    main { max-width: 1000px; margin: 30px auto; padding: 16px; }
    .panel, .submission {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid #e1e5eb;
    }
    input, button {
      padding: 11px;
      border-radius: 7px;
      border: 1px solid #ccd2da;
      font-size: 15px;
    }
    button { cursor: pointer; font-weight: bold; }
    .primary { background: #e45a2a; color: white; border: 0; }
    .approve { background: #16834a; color: white; border: 0; }
    .reject { background: #b42318; color: white; border: 0; }
    .photos { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
    .photos img { width: 140px; height: 100px; object-fit: cover; border-radius: 8px; }
    .muted { color: #657184; }
    #message { margin: 15px 0; white-space: pre-wrap; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>TravelTaste Admin</h1>
    <button id="logoutButton">Log out</button>
  </header>

  <main>
    <section class="panel" id="loginPanel">
      <h2>Admin login</h2>
      <p class="muted">Sign in with your TravelTaste admin account.</p>
      <form id="loginForm">
        <p><input id="email" type="email" placeholder="Email address" required></p>
        <p><input id="password" type="password" placeholder="Password" required></p>
        <button class="primary" type="submit">Log in</button>
      </form>
    </section>

    <div id="message" role="status"></div>

    <section id="dashboard" hidden>
      <div class="panel">
        <h2>Pending submissions</h2>
        <p class="muted">Review each place before publishing it on Explore.</p>
        <button class="primary" id="refreshButton">Refresh submissions</button>
      </div>

<div id="submissions"></div>

<div class="panel">
  <h2>Approved submissions</h2>
  <p class="muted">Publish places that have already been approved.</p>
  <button class="primary" id="refreshApprovedButton">
    Refresh approved submissions
  </button>
</div>
<div id="approvedSubmissions"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://xhmztvfcosvqkeqnhzer.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4TF5i_4Wtm5gogItPlQsRg_ck5n_dfi';

    const supabaseClient = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    }[char]));

    function showMessage(text) {
      $('message').textContent = text;
    }

    async function checkAdmin() {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        $('loginPanel').hidden = false;
        $('dashboard').hidden = true;
        return false;
      }

      
const { data, error: adminError } = await supabaseClient
  .from('travel_admins')
  .select('user_id')
  .eq('user_id', user.id)
  .maybeSingle();


      if (adminError || !data) {
        $('loginPanel').hidden = true;
        $('dashboard').hidden = true;
        showMessage('This account is not authorized as a TravelTaste admin.');
        return false;
      }

      $('loginPanel').hidden = true;
      $('dashboard').hidden = false;
      return true;
    }

    async function loadSubmissions() {
      $('submissions').replaceChildren();
      showMessage('Loading submissions…');

      
const { data, error } = await supabaseClient
  .from('place_submissions')
  .select('*')
  .eq('status', 'pending')
  .order('created_at', { ascending: true });


      if (error) {
        showMessage('Could not load submissions: ' + error.message);
        return;
      }

      if (!data.length) {
        showMessage('There are no pending submissions.');
        return;
      }

      showMessage('Pending submissions: ' + data.length);

      for (const item of data) {
        const card = document.createElement('article');
        card.className = 'submission';

        const photos = Array.isArray(item.image_urls) ? item.image_urls : [];
        const photoHTML = photos.map(url =>
          `<img src="${escapeHTML(url)}" alt="Submitted photo" loading="lazy">`
        ).join('');

        card.innerHTML = `
          <h2>${escapeHTML(item.name)}</h2>
          <p><strong>Category:</strong> ${escapeHTML(item.type)}</p>
          <p><strong>Traveler type:</strong> ${escapeHTML(item.traveler_type)}</p>
          <p><strong>Rating:</strong> ${escapeHTML(item.rating)} / 5</p>
          <p><strong>Description:</strong> ${escapeHTML(item.description || 'Not provided')}</p>
          <p><strong>Travel tips:</strong> ${escapeHTML(item.travel_tips || 'Not provided')}</p>
          <p><strong>Google Maps:</strong> ${
            item.google_maps_url
              ? `<a href="${escapeHTML(item.google_maps_url)}" target="_blank" rel="noopener noreferrer">Open map</a>`
              : 'Not provided'
          }</p>
          <div class="photos">${photoHTML}</div>
          <div class="actions">
            <button class="approve" data-action="approve">Approve</button>
            <button class="reject" data-action="reject">Reject</button>
          </div>
        `;

        card.querySelector('[data-action="approve"]').addEventListener('click', () =>
          reviewSubmission(item.id, 'approved')
        );
        card.querySelector('[data-action="reject"]').addEventListener('click', () =>
          reviewSubmission(item.id, 'rejected')
        );

        $('submissions').appendChild(card);
      }
    }

   
async function reviewSubmission(id, decision) {
  if (!confirm(`Are you sure you want to ${decision} this submission?`)) {
    return;
  }

  showMessage('Saving review…');

  const { data: { user }, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !user) {
    showMessage('Please log in again.');
    return;
  }

  if (decision === 'approved') {
    const { error: approvalError } = await supabaseClient
      .from('place_submissions')
      .update({
        status: 'approved',
        reviewed_at: new Date().toISOString(),
        reviewed_by: user.id
      })
      .eq('id', id)
      .eq('status', 'pending');

    if (approvalError) {
      showMessage('Approval failed: ' + approvalError.message);
      return;
    }

    const { error: publishError } = await supabaseClient.rpc(
      'publish_approved_submission',
      { p_submission_id: id }
    );

    if (publishError) {
      showMessage(
        'Approved, but publishing failed: ' + publishError.message
      );
      await loadSubmissions();
      return;
    }

    showMessage('Place approved and published to Explore!');
  } else {
    const { error: rejectError } = await supabaseClient
      .from('place_submissions')
      .update({
        status: 'rejected',
        reviewed_at: new Date().toISOString(),
        reviewed_by: user.id
      })
      .eq('id', id)
      .eq('status', 'pending');

    if (rejectError) {
      showMessage('Rejection failed: ' + rejectError.message);
      return;
    }

    showMessage('Submission rejected.');
  }

  await loadSubmissions();
}

async function loadApprovedSubmissions() {
  $('approvedSubmissions').replaceChildren();
  showMessage('Loading approved submissions…');

  const { data, error } = await supabaseClient
    .from('place_submissions')
    .select('*')
    .eq('status', 'approved')
    .order('created_at', { ascending: false });

  if (error) {
    showMessage('Could not load approved submissions: ' + error.message);
    return;
  }

  if (!data.length) {
    showMessage('There are no approved submissions.');
    return;
  }

  showMessage('Approved submissions: ' + data.length);

  for (const item of data) {
    const card = document.createElement('article');
    card.className = 'submission';

    card.innerHTML = `
      <h2>${escapeHTML(item.name)}</h2>
      <p><strong>Status:</strong> Approved</p>
      <button class="approve" data-action="publish">Publish to Explore</button>
    `;

    card.querySelector('[data-action="publish"]').addEventListener('click', async () => {
      if (!confirm('Publish ' + item.name + ' to Explore?')) return;

showMessage('Publishing ' + item.name + '… Please wait.');
      const { error: publishError } = await supabaseClient.rpc(
        'publish_approved_submission',
        { p_submission_id: item.id }
      );

      if (publishError) {
        showMessage('Publishing failed: ' + publishError.message);
        return;
      }

      showMessage(item.name + ' published successfully!');
      await loadApprovedSubmissions();
    });

    $('approvedSubmissions').appendChild(card);
  }
}


    

    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      showMessage('Signing in…');

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });

      if (error) {
        showMessage('Login failed: ' + error.message);
        return;
      }

      if (await checkAdmin()) await loadSubmissions();
    });

    $('logoutButton').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      $('dashboard').hidden = true;
      $('loginPanel').hidden = false;
      showMessage('You are logged out.');
    });

    $('refreshButton').addEventListener('click', async () => {
      if (await checkAdmin()) await loadSubmissions();
    });
    
$('refreshApprovedButton').addEventListener('click', async () => {
  if (await checkAdmin()) await loadApprovedSubmissions();
});


  
(async () => {
  if (await checkAdmin()) {
    await loadSubmissions();
    await loadApprovedSubmissions();
  }
})();

  </script>
</body>
</html>
