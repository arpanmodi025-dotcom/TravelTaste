<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://xhmztvfcosvqkeqnhzer.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4TF5i_4Wtm5gogItPlQsRg_ck5n_dfi';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

const MAX_FILE_SIZE = 5 * 1024 * 1024;
const BUCKET = 'community-photos';
const REACTIONS = ['like', 'love'];

let currentUser = null;
let busyPostIds = new Set();

function message(text) {
  $('status').textContent = text;
}

function showAccount(user) {
  currentUser = user;
  $('account').textContent = user
    ? `Logged in as ${user.email || 'Community member'}`
    : 'Log in or create an account to share photos.';

  $('auth').classList.toggle('hidden', !!user);
  $('logout').classList.toggle('hidden', !user);
  $('composer').classList.toggle('hidden', !user);
}

function validateCredentials() {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !$('email').checkValidity() || password.length < 6) {
    message('Enter a valid email and a password of at least 6 characters.');
    return null;
  }

  return { email, password };
}

$('signup').addEventListener('click', async () => {
  const credentials = validateCredentials();
  if (!credentials) return;

  $('signup').disabled = true;
  message('Creating your account…');

  try {
    const { data, error } = await supabase.auth.signUp(credentials);
    if (error) throw error;

    if (data.session) {
      showAccount(data.user);
      message('Account created successfully!');
      await loadFeed();
    } else {
      message('Check your email for a confirmation link, then log in.');
    }
  } catch (error) {
    message(error.message || 'Could not create your account.');
  } finally {
    $('signup').disabled = false;
  }
});

$('login').addEventListener('click', async () => {
  const credentials = validateCredentials();
  if (!credentials) return;

  $('login').disabled = true;
  message('Logging in…');

  try {
    const { data, error } = await supabase.auth.signInWithPassword(credentials);
    if (error) throw error;

    showAccount(data.user);
    message('Login successful!');
    await loadFeed();
  } catch (error) {
    message(error.message || 'Could not log in.');
  } finally {
    $('login').disabled = false;
  }
});

$('logout').addEventListener('click', async () => {
  $('logout').disabled = true;

  try {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;

    showAccount(null);
    message('You have logged out.');
    await loadFeed();
  } catch (error) {
    message(error.message || 'Could not log out.');
  } finally {
    $('logout').disabled = false;
  }
});

function validatePhoto(file) {
  if (!file) return null;

  const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
  if (!allowedTypes.includes(file.type)) {
    throw new Error('Choose a JPEG, PNG, or WebP image.');
  }
  if (file.size > MAX_FILE_SIZE) {
    throw new Error('The photo must be 5 MB or smaller.');
  }

  return file;
}

$('publish').addEventListener('click', async () => {
  if (!currentUser) {
    message('Log in before sharing a post.');
    return;
  }

  const caption = $('caption').value.trim();
  const file = $('photo').files[0];

  if (!caption && !file) {
    message('Add a caption or choose a photo before sharing.');
    return;
  }

  let uploadedPath = null;
  $('publish').disabled = true;
  message('Sharing your post…');

  try {
    validatePhoto(file);

    let imageUrl = null;

    if (file) {
      const extensionByType = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp'
      };
      uploadedPath =
        `${currentUser.id}/${crypto.randomUUID()}.${extensionByType[file.type]}`;

      const { error: uploadError } = await supabase.storage
        .from(BUCKET)
        .upload(uploadedPath, file, {
          contentType: file.type,
          cacheControl: '3600',
          upsert: false
        });

      if (uploadError) throw uploadError;

      imageUrl = supabase.storage.from(BUCKET).getPublicUrl(uploadedPath)
        .data.publicUrl;
    }

    const { error: insertError } = await supabase
      .from('community_posts')
      .insert({
        user_id: currentUser.id,
        caption,
        image_url: imageUrl
      });

    if (insertError) throw insertError;

    $('caption').value = '';
    $('photo').value = '';
    message('Post shared!');
    await loadFeed();
  } catch (error) {
    // Avoid leaving an unused image in Storage if saving the post failed.
    if (uploadedPath) {
      await supabase.storage.from(BUCKET).remove([uploadedPath]);
    }
    message(error.message || 'Could not share your post.');
  } finally {
    $('publish').disabled = false;
  }
});

function safeImageUrl(value) {
  if (!value) return null;

  try {
    const url = new URL(value);
    return url.protocol === 'https:' ? url.href : null;
  } catch {
    return null;
  }
}

function renderFeed(posts, likes) {
  const feed = $('feed');
  feed.replaceChildren();

  if (!posts.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No posts yet. Be the first to share an experience!';
    feed.append(empty);
    return;
  }

  const counts = new Map();
  const myReactions = new Map();

  for (const row of likes) {
    const postCounts = counts.get(row.post_id) || { like: 0, love: 0 };
    if (REACTIONS.includes(row.reaction)) {
      postCounts[row.reaction]++;
    }
    counts.set(row.post_id, postCounts);

    if (row.user_id === currentUser?.id) {
      myReactions.set(row.post_id, row.reaction);
    }
  }

  for (const post of posts) {
    const card = document.createElement('article');
    card.className = 'card post';

    if (post.caption) {
      const caption = document.createElement('p');
      caption.className = 'caption';
      caption.textContent = post.caption;
      card.append(caption);
    }

    const imageUrl = safeImageUrl(post.image_url);
    if (imageUrl) {
      const image = document.createElement('img');
      image.src = imageUrl;
      image.alt = 'Photo shared by a community member';
      image.loading = 'lazy';
      card.append(image);
    }

    const date = document.createElement('p');
    date.className = 'small';
    const createdAt = new Date(post.created_at);
    date.textContent = Number.isNaN(createdAt.getTime())
      ? 'Community member'
      : `Community member · ${createdAt.toLocaleString()}`;
    card.append(date);

    const reactions = document.createElement('div');
    reactions.className = 'reactions';

    const postCounts = counts.get(post.id) || { like: 0, love: 0 };
    for (const reaction of REACTIONS) {
      const button = document.createElement('button');
      const active = myReactions.get(post.id) === reaction;

      button.type = 'button';
      button.className = active ? '' : 'secondary';
      button.textContent =
        `${reaction === 'like' ? '👍 Like' : '❤️ Love'} (${postCounts[reaction]})`;
      button.setAttribute('aria-pressed', String(active));
      button.disabled = !currentUser;

      if (!currentUser) button.title = 'Log in to react';
      button.addEventListener('click', () => reactToPost(post.id, reaction));
      reactions.append(button);
    }

    card.append(reactions);
    feed.append(card);
  }
}

async function loadFeed() {
  $('feed').replaceChildren(Object.assign(document.createElement('p'), {
    textContent: 'Loading posts…'
  }));

  try {
    const { data: posts, error: postsError } = await supabase
      .from('community_posts')
      .select('id, user_id, caption, image_url, created_at')
      .order('created_at', { ascending: false })
      .limit(50);

    if (postsError) throw postsError;

    if (!posts?.length) {
      renderFeed([], []);
      return;
    }

    const { data: likes, error: likesError } = await supabase
      .from('community_post_likes')
      .select('post_id, user_id, reaction')
      .in('post_id', posts.map(post => post.id));

    if (likesError) throw likesError;

    renderFeed(posts, likes || []);
  } catch (error) {
    $('feed').replaceChildren();
    const errorText = document.createElement('p');
    errorText.textContent = 'Could not load posts. Please try again.';
    $('feed').append(errorText);
    message(error.message || 'Could not load posts.');
  }
}

async function reactToPost(postId, reaction) {
  if (!currentUser || busyPostIds.has(postId)) return;

  busyPostIds.add(postId);
  try {
    const { data: existing, error: readError } = await supabase
      .from('community_post_likes')
      .select('reaction')
      .eq('post_id', postId)
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (readError) throw readError;

    let result;
    if (existing?.reaction === reaction) {
      result = await supabase
        .from('community_post_likes')
        .delete()
        .eq('post_id', postId)
        .eq('user_id', currentUser.id);
    } else {
      result = await supabase
        .from('community_post_likes')
        .upsert(
          { post_id: postId, user_id: currentUser.id, reaction },
          { onConflict: 'post_id,user_id' }
        );
    }

    if (result.error) throw result.error;
    await loadFeed();
  } catch (error) {
    message(error.message || 'Could not update your reaction.');
  } finally {
    busyPostIds.delete(postId);
  }
}

// Restore the existing session and refresh the UI when auth changes.
const { data: authListener } = supabase.auth.onAuthStateChange(
  (_event, session) => {
    showAccount(session?.user ?? null);
    // Defer Supabase requests until the auth callback has completed.
    setTimeout(() => void loadFeed(), 0);
  }
);

const { data: sessionData, error: sessionError } =
  await supabase.auth.getSession();

if (sessionError) message(sessionError.message);
showAccount(sessionData?.session?.user ?? null);
await loadFeed();
</script>
