<!doctype html>
<html lang="en">
<head>
 <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ef6c3b">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-site-verification" content="JQAQ6HlP4qu9xkoeFyad3qcS66Aib81N_Rh5g1brGuE" />
 <title>TravelTaste</title>
<style>
:root{--brand:#ef6c3b;--ink:#17202a;--muted:#68737d;--cream:#fff8f1;--line:#e8e1da}*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;color:var(--ink);background:#fff}nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6%;gap:20px}.logo{font-size:25px;font-weight:900;color:var(--brand)}.spacer{flex:1}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:#fff0e8;color:#b94c20}.hero{background:linear-gradient(135deg,#fff8f1,#fff0e7);padding:80px 20px;text-align:center}.hero h1{font-size:clamp(38px,6vw,70px);margin:0 0 16px;letter-spacing:-2px}.hero p{max-width:650px;margin:0 auto 28px;color:var(--muted);font-size:18px}.search{max-width:650px;margin:auto;background:white;border:1px solid var(--line);padding:10px;border-radius:16px;display:flex;gap:10px;box-shadow:0 15px 40px #b94c2012}.search select{flex:1;border:0;padding:12px;font-size:16px;outline:0;background:white}main{max-width:1100px;margin:auto;padding:45px 20px 80px}.empty{padding:35px;border:1px dashed #d9cec5;border-radius:16px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden}.pic{height:150px;background:#f5e4d8;display:grid;place-items:center;font-size:44px}.body{padding:16px}.tag{font-size:12px;background:#f7eee8;padding:5px 8px;border-radius:99px;font-weight:800}.muted{color:var(--muted);font-size:14px}footer{background:#17202a;color:white;padding:35px 6%}@media(max-width:600px){.search{flex-direction:column}.hero{padding:55px 20px}nav{padding:0 18px}}
</style></head>
<body>
<nav><div class="logo">TravelTaste</div><div class="spacer"></div>
<button class="secondary" onclick="window.location.href='community.html'">📸 Community</button></nav>

<header class="hero"><h1>Where do you want to travel?</h1><p>Discover places, food, famous food shops, activities and hidden gems — all in one place.</p><div class="search"><select id="city"><option value="">Choose a destination...</option></select><button class="primary" onclick="explore()">Explore</button></div></header>
<main><h2 id="title">TravelTaste</h2><p id="subtitle" class="muted">Choose a destination above.</p><div id="list" class="empty">Your destination recommendations will appear here.</div></main>
<footer><strong>TravelTaste</strong><p>Discover the taste of every destination.</p></footer>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
/* Replace only these two values with the values from your Supabase Connect window. */
const SUPABASE_URL='https://xhmztvfcosvqkeqnhzer.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_4TF5i_4Wtm5gogItPlQsRg_ck5n_dfi';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cities=[];
async function start(){
 const {data,error}=await supabase.from('cities').select('*').order('name');
 if(error){document.getElementById('subtitle').textContent='Supabase connection needs to be configured.';return}
 cities=data||[]; document.getElementById('city').innerHTML='<option value="">Choose a destination...</option>'+cities.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}${c.state?', '+escapeHtml(c.state):''}</option>`).join('');
}
window.explore=async()=>{const id=document.getElementById('city').value;if(!id)return alert('Please choose a destination.');const c=cities.find(x=>x.id===id);document.getElementById('title').textContent=c.name;document.getElementById('subtitle').textContent=c.description||'Explore TravelTaste recommendations.';const {data,error}=await supabase.from('listings').select('*').eq('city_id',id).eq('is_published',true).order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}if(!data?.length){document.getElementById('list').innerHTML='<div class="empty">No recommendations added yet for this city.</div>';return}document.getElementById('list').className='grid';document.getElementById('list').innerHTML=data.map(x=>`<article class="card"><div class="pic">${x.image_url?`<img src="${escapeHtml(x.image_url)}" style="width:100%;height:100%;object-fit:cover">`:'📍'}</div><div class="body"><span class="tag">${escapeHtml(x.type)}</span><h3>${escapeHtml(x.name)}</h3><p class="muted">${escapeHtml(x.address||'')}</p><p>${escapeHtml(x.description||'')}</p><a href="${escapeHtml(x.google_maps_url||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((x.address||'')+' '+c.name)}`)}" target="_blank" rel="noopener"><button class="secondary">🗺️ Exact Location</button></a></div></article>`).join('')};
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
start();
</script></body></html>
